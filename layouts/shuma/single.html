```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>

  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Shuma">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --sky-top: #dff5ff;
      --sky-middle: #edfaff;
      --sky-bottom: #d3ecfc;
      --blue-main: #589ac3;
      --blue-text: #547f99;
      --blue-soft: #a8dafa;
      --pink: #f39cc0;
      --pink-soft: #ffd5e7;
      --glass: rgba(255, 255, 255, 0.74);
      --glass-border: rgba(255, 255, 255, 0.94);
      --shadow: rgba(78, 143, 184, 0.17);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Nunito", sans-serif;
      color: var(--blue-text);
      background:
        radial-gradient(circle at 13% 15%, rgba(255,255,255,0.92) 0 7%, transparent 8%),
        radial-gradient(circle at 87% 19%, rgba(255,255,255,0.78) 0 6%, transparent 7%),
        linear-gradient(160deg, var(--sky-top) 0%, var(--sky-middle) 45%, var(--sky-bottom) 100%);
      overflow-x: hidden;
    }

    .shuma-page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 38px 22px;
      overflow: hidden;
      isolation: isolate;
    }

    .shuma-page::before {
      content: "";
      position: absolute;
      width: min(760px, 94vw);
      height: min(760px, 94vw);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.7) 0%,
        rgba(255, 255, 255, 0.25) 45%,
        transparent 72%
      );
      z-index: -1;
    }

    /* Clouds */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      box-shadow: 0 14px 35px rgba(132, 191, 223, 0.16);
      animation: cloudFloat 9s ease-in-out infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud-one {
      top: 11%;
      left: -34px;
      width: 150px;
      height: 44px;
    }

    .cloud-one::before {
      width: 62px;
      height: 62px;
      left: 29px;
      bottom: 13px;
    }

    .cloud-one::after {
      width: 47px;
      height: 47px;
      right: 24px;
      bottom: 16px;
    }

    .cloud-two {
      right: -40px;
      bottom: 14%;
      width: 178px;
      height: 50px;
      animation-delay: -3s;
    }

    .cloud-two::before {
      width: 69px;
      height: 69px;
      left: 37px;
      bottom: 15px;
    }

    .cloud-two::after {
      width: 54px;
      height: 54px;
      right: 31px;
      bottom: 17px;
    }

    @keyframes cloudFloat {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    /* Floating hearts */
    .hearts {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      bottom: -70px;
      width: var(--size);
      height: var(--size);
      background: var(--heart-color);
      transform: rotate(-45deg);
      opacity: 0;
      animation: rise var(--duration) linear infinite;
      animation-delay: var(--delay);
      filter: drop-shadow(0 4px 6px rgba(104, 176, 211, 0.12));
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--heart-color);
    }

    .heart::before {
      top: calc(var(--size) * -0.5);
      left: 0;
    }

    .heart::after {
      top: 0;
      left: calc(var(--size) * 0.5);
    }

    @keyframes rise {
      0% {
        opacity: 0;
        transform: translateY(0) rotate(-45deg) scale(0.8);
      }
      10% {
        opacity: 0.76;
      }
      80% {
        opacity: 0.56;
      }
      100% {
        opacity: 0;
        transform: translateY(-115vh) rotate(-25deg) scale(1.15);
      }
    }

    /* Main card */
    .card {
      position: relative;
      width: min(610px, 100%);
      padding: 54px 44px 42px;
      background: var(--glass);
      border: 1.5px solid var(--glass-border);
      border-radius: 38px;
      text-align: center;
      box-shadow:
        0 25px 70px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
    }

    .card::before {
      content: "♡";
      position: absolute;
      top: 19px;
      left: 26px;
      font-size: 27px;
      color: var(--pink);
      transform: rotate(-13deg);
    }

    .card::after {
      content: "♡";
      position: absolute;
      bottom: 20px;
      right: 26px;
      font-size: 25px;
      color: #76bbe5;
      transform: rotate(12deg);
    }

    .title {
      margin: 0 0 26px;
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: clamp(76px, 14vw, 104px);
      line-height: 0.98;
      color: var(--blue-main);
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.64);
    }

    .title-heart {
      color: var(--pink);
      font-size: 0.72em;
      vertical-align: 12%;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin: 0 auto 30px;
      color: #a0cfe8;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      width: 70px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(125, 191, 227, 0.64)
      );
    }

    .divider::after {
      transform: scaleX(-1);
    }

    .divider span {
      color: var(--pink);
      font-size: 19px;
    }

    /* Visible note */
    .letter {
      margin: 0 auto;
      padding: 31px 28px 28px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px dashed rgba(130, 193, 226, 0.62);
      border-radius: 25px;
    }

    .letter-content {
      font-size: 17px;
      line-height: 2;
      color: #587e96;
      text-align: center;
    }

    .letter-content p {
      margin: 0;
    }

    /* Reveal button */
    .reveal-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 27px;
      padding: 11px 25px;
      font-family: "Nunito", sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #69a6ca;
      background: rgba(229, 246, 255, 0.87);
      border: 1px solid rgba(154, 210, 240, 0.75);
      border-radius: 999px;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .reveal-button:hover {
      transform: translateY(-2px);
      background: rgba(255, 231, 242, 0.88);
      box-shadow: 0 8px 20px rgba(98, 161, 199, 0.13);
    }

    .reveal-button:active {
      transform: translateY(0);
    }

    .button-heart {
      color: var(--pink);
      font-size: 18px;
    }

    /* Hidden English message */
    .hidden-note {
      max-height: 0;
      margin-top: 0;
      padding: 0 25px;
      overflow: hidden;
      opacity: 0;
      background: rgba(255, 239, 247, 0.45);
      border: 1px solid transparent;
      border-radius: 22px;
      transition:
        max-height 0.65s ease,
        margin-top 0.45s ease,
        padding 0.45s ease,
        opacity 0.45s ease,
        border-color 0.45s ease;
    }

    .hidden-note.is-open {
      max-height: 650px;
      margin-top: 22px;
      padding: 23px 25px;
      opacity: 1;
      border-color: rgba(245, 188, 213, 0.58);
    }

    .hidden-note p {
      margin: 0;
      font-size: 16px;
      line-height: 1.85;
      color: #63869c;
    }

    .footer-heart {
      margin: 31px 0 0;
      font-size: 32px;
      color: #82bddf;
    }

    .sparkle {
      position: absolute;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.93);
      animation: sparkle 3.8s ease-in-out infinite;
    }

    .sparkle-one {
      top: 87px;
      right: 47px;
    }

    .sparkle-two {
      left: 45px;
      bottom: 109px;
      animation-delay: -1.8s;
    }

    @keyframes sparkle {
      0%,
      100% {
        transform: scale(0.82) rotate(0deg);
        opacity: 0.46;
      }
      50% {
        transform: scale(1.22) rotate(10deg);
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .shuma-page {
        padding: 27px 15px;
      }

      .card {
        padding: 47px 19px 30px;
        border-radius: 29px;
      }

      .title {
        margin-bottom: 22px;
      }

      .divider {
        margin-bottom: 25px;
      }

      .letter {
        padding: 26px 18px 24px;
      }

      .letter-content {
        font-size: 15px;
      }

      .hidden-note.is-open {
        padding: 19px 17px;
      }

      .hidden-note p {
        font-size: 15px;
      }

      .cloud-one {
        top: 4%;
        transform: scale(0.75);
      }

      .cloud-two {
        bottom: 5%;
        transform: scale(0.7);
      }

      .sparkle-one {
        top: 73px;
        right: 23px;
      }

      .sparkle-two {
        left: 22px;
        bottom: 88px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart,
      .cloud,
      .sparkle {
        animation: none;
      }

      .heart {
        display: none;
      }

      .hidden-note,
      .reveal-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="shuma-page">

    <div class="cloud cloud-one" aria-hidden="true"></div>
    <div class="cloud cloud-two" aria-hidden="true"></div>

    <div class="hearts" aria-hidden="true">
      <span class="heart" style="left: 5%; --size: 13px; --heart-color: #ffffff; --duration: 13s; --delay: -2s;"></span>
      <span class="heart" style="left: 11%; --size: 19px; --heart-color: #ffd9ea; --duration: 17s; --delay: -8s;"></span>
      <span class="heart" style="left: 18%; --size: 11px; --heart-color: #a9dcf7; --duration: 12s; --delay: -5s;"></span>
      <span class="heart" style="left: 25%; --size: 17px; --heart-color: #ffffff; --duration: 18s; --delay: -11s;"></span>
      <span class="heart" style="left: 33%; --size: 12px; --heart-color: #ffc6df; --duration: 14s; --delay: -1s;"></span>
      <span class="heart" style="left: 40%; --size: 14px; --heart-color: #b6e2f8; --duration: 16s; --delay: -10s;"></span>
      <span class="heart" style="left: 49%; --size: 9px; --heart-color: #ffffff; --duration: 12s; --delay: -7s;"></span>
      <span class="heart" style="left: 57%; --size: 18px; --heart-color: #ffd9ea; --duration: 19s; --delay: -12s;"></span>
      <span class="heart" style="left: 64%; --size: 11px; --heart-color: #ffffff; --duration: 14s; --delay: -4s;"></span>
      <span class="heart" style="left: 71%; --size: 16px; --heart-color: #abdafa; --duration: 17s; --delay: -9s;"></span>
      <span class="heart" style="left: 78%; --size: 12px; --heart-color: #ffd1e4; --duration: 13s; --delay: -6s;"></span>
      <span class="heart" style="left: 86%; --size: 20px; --heart-color: #ffffff; --duration: 18s; --delay: -13s;"></span>
      <span class="heart" style="left: 92%; --size: 13px; --heart-color: #b1ddf6; --duration: 15s; --delay: -3s;"></span>
      <span class="heart" style="left: 97%; --size: 10px; --heart-color: #ffdaea; --duration: 12s; --delay: -9s;"></span>
    </div>

    <section class="card" aria-label="Shuma page">
      <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
      <span class="sparkle sparkle-two" aria-hidden="true">✦</span>

      <h1 class="title">
        Shuma <span class="title-heart">♡</span>
      </h1>

      <div class="divider" aria-hidden="true">
        <span>♡</span>
      </div>

      <div class="letter">
        <div class="letter-content">
          {{ .Content }}
        </div>
      </div>

      {{ with .Params.english_note }}
        <button
          class="reveal-button"
          id="revealButton"
          type="button"
          aria-expanded="false"
          aria-controls="englishNote"
        >
          <span class="button-heart">♡</span>
          <span id="buttonText">read more</span>
          <span class="button-heart">♡</span>
        </button>

        <div class="hidden-note" id="englishNote">
          <p>{{ . }}</p>
        </div>
      {{ end }}

      <p class="footer-heart" aria-hidden="true">♡</p>
    </section>

  </main>

  <script>
    const revealButton = document.getElementById("revealButton");
    const englishNote = document.getElementById("englishNote");
    const buttonText = document.getElementById("buttonText");

    if (revealButton && englishNote && buttonText) {
      revealButton.addEventListener("click", function () {
        const isOpen = englishNote.classList.toggle("is-open");

        revealButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
        buttonText.textContent = isOpen ? "close" : "read more";
      });
    }
  </script>
</body>
</html>

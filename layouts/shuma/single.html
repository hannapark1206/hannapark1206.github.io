<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>

  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="{{ .Title }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --sky-top: #dcf4ff;
      --sky-middle: #effaff;
      --sky-bottom: #d5edfd;
      --blue-main: #589ac3;
      --blue-text: #557f99;
      --blue-soft: #a9daf6;
      --pink: #f39cc0;
      --pink-soft: #ffd7e8;
      --glass: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.96);
      --shadow: rgba(77, 142, 183, 0.17);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Nunito", "Klee One", sans-serif;
      color: var(--blue-text);
      background:
        radial-gradient(circle at 12% 15%, rgba(255, 255, 255, 0.94) 0 7%, transparent 8%),
        radial-gradient(circle at 88% 18%, rgba(255, 255, 255, 0.76) 0 6%, transparent 7%),
        linear-gradient(160deg, var(--sky-top) 0%, var(--sky-middle) 44%, var(--sky-bottom) 100%);
      overflow-x: hidden;
    }

    .shuma-page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 34px 20px;
      overflow: hidden;
      isolation: isolate;
    }

    .shuma-page::before {
      content: "";
      position: absolute;
      width: min(760px, 95vw);
      height: min(760px, 95vw);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.74) 0%,
        rgba(255, 255, 255, 0.24) 46%,
        transparent 73%
      );
      z-index: -1;
    }

    /* Clouds */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.73);
      border-radius: 999px;
      box-shadow: 0 14px 35px rgba(132, 191, 223, 0.15);
      animation: cloud-float 9s ease-in-out infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud-one {
      top: 10%;
      left: -35px;
      width: 150px;
      height: 44px;
    }

    .cloud-one::before {
      width: 62px;
      height: 62px;
      left: 29px;
      bottom: 13px;
    }

    .cloud-one::after {
      width: 47px;
      height: 47px;
      right: 24px;
      bottom: 16px;
    }

    .cloud-two {
      right: -42px;
      bottom: 13%;
      width: 180px;
      height: 51px;
      animation-delay: -3s;
    }

    .cloud-two::before {
      width: 70px;
      height: 70px;
      left: 38px;
      bottom: 15px;
    }

    .cloud-two::after {
      width: 54px;
      height: 54px;
      right: 31px;
      bottom: 17px;
    }

    @keyframes cloud-float {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    /* Floating hearts */
    .hearts {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      bottom: -60px;
      width: var(--size);
      height: var(--size);
      background: var(--heart-color);
      transform: rotate(-45deg);
      opacity: 0;
      animation: heart-rise var(--duration) linear infinite;
      animation-delay: var(--delay);
      filter: drop-shadow(0 4px 6px rgba(103, 173, 211, 0.12));
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: var(--size);
      height: var(--size);
      background: var(--heart-color);
      border-radius: 50%;
    }

    .heart::before {
      top: calc(var(--size) * -0.5);
      left: 0;
    }

    .heart::after {
      top: 0;
      left: calc(var(--size) * 0.5);
    }

    @keyframes heart-rise {
      0% {
        opacity: 0;
        transform: translateY(0) rotate(-45deg) scale(0.8);
      }

      10% {
        opacity: 0.76;
      }

      80% {
        opacity: 0.56;
      }

      100% {
        opacity: 0;
        transform: translateY(-115vh) rotate(-25deg) scale(1.15);
      }
    }

    /* Main card */
    .card {
      position: relative;
      width: min(650px, 100%);
      padding: 54px 44px 40px;
      background: var(--glass);
      border: 1.5px solid var(--glass-border);
      border-radius: 38px;
      text-align: center;
      box-shadow:
        0 25px 70px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
    }

    .card::before {
      content: "♡";
      position: absolute;
      top: 20px;
      left: 27px;
      font-size: 27px;
      color: var(--pink);
      transform: rotate(-13deg);
    }

    .card::after {
      content: "♡";
      position: absolute;
      bottom: 19px;
      right: 27px;
      font-size: 26px;
      color: #76bbe5;
      transform: rotate(12deg);
    }

    /* Title from index.md */
    .title {
      margin: 0;
      font-family: "Klee One", serif;
      font-weight: 600;
      font-size: clamp(58px, 11vw, 84px);
      line-height: 1.2;
      letter-spacing: 0.07em;
      color: var(--blue-main);
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.64);
    }

    /* Subtitle from index.md */
    .subtitle {
      margin: 18px auto 33px;
      font-family: "Klee One", serif;
      font-size: 22px;
      font-weight: 600;
      color: #78aac8;
      letter-spacing: 0.05em;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin: 0 auto 40px;
      color: #a0cfe8;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      width: 70px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(125, 191, 227, 0.65)
      );
    }

    .divider::after {
      transform: scaleX(-1);
    }

    .divider span {
      color: var(--pink);
      font-size: 20px;
    }

    /* Message box */
    .letter {
      position: relative;
      margin: 0 auto;
      padding: 48px 27px 29px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px dashed rgba(130, 193, 226, 0.62);
      border-radius: 25px;
    }

    /* Pill label from note_label in index.md */
    .note-label {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 30px 13px;
      min-width: 220px;
      background: rgba(247, 252, 255, 0.98);
      border: 2px solid rgba(176, 215, 239, 0.88);
      border-radius: 999px;
      font-family: "Klee One", serif;
      font-size: 23px;
      font-weight: 600;
      color: #74a8cb;
      letter-spacing: 0.04em;
      line-height: 1.2;
      white-space: nowrap;
      box-shadow: 0 7px 18px rgba(119, 169, 204, 0.08);
    }

    .letter-content {
      font-family: "Klee One", serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 2.25;
      color: #587e96;
      text-align: center;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .letter-content p {
      margin: 0;
    }

    .letter-content p + p {
      margin-top: 12px;
    }

    /* Open and close button */
    .reveal-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin-top: 29px;
      padding: 13px 34px;
      font-family: "Klee One", serif;
      font-size: 18px;
      font-weight: 600;
      color: #d081a3;
      background: rgba(255, 225, 239, 0.79);
      border: 1px solid rgba(244, 178, 207, 0.76);
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 9px 22px rgba(118, 180, 215, 0.12);
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .reveal-button:hover {
      transform: translateY(-2px);
      background: rgba(255, 216, 233, 0.92);
      box-shadow: 0 12px 25px rgba(118, 180, 215, 0.18);
    }

    .reveal-button:active {
      transform: translateY(0);
    }

    .button-heart {
      color: var(--pink);
      font-size: 20px;
    }

    /* Hidden English message */
    .hidden-note {
      display: grid;
      grid-template-rows: 0fr;
      margin-top: 0;
      opacity: 0;
      transition:
        grid-template-rows 0.6s ease,
        margin-top 0.45s ease,
        opacity 0.45s ease;
    }

    .hidden-note-inner {
      min-height: 0;
      overflow: hidden;
    }

    .hidden-note-box {
      padding: 25px 27px;
      background: rgba(255, 238, 247, 0.5);
      border: 1px solid rgba(245, 188, 213, 0.66);
      border-radius: 23px;
    }

    .hidden-note.is-open {
      grid-template-rows: 1fr;
      margin-top: 23px;
      opacity: 1;
    }

    .hidden-note-box p {
      margin: 0;
      font-family: "Nunito", sans-serif;
      font-size: 16px;
      line-height: 1.92;
      color: #63869c;
      text-align: center;
    }

    .footer-heart {
      margin: 29px 0 0;
      font-size: 32px;
      color: #82bddf;
    }

    .sparkle {
      position: absolute;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.94);
      animation: sparkle 3.8s ease-in-out infinite;
    }

    .sparkle-one {
      top: 89px;
      right: 48px;
    }

    .sparkle-two {
      left: 45px;
      bottom: 108px;
      animation-delay: -1.8s;
    }

    @keyframes sparkle {
      0%,
      100% {
        transform: scale(0.82) rotate(0deg);
        opacity: 0.45;
      }

      50% {
        transform: scale(1.22) rotate(10deg);
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      .shuma-page {
        padding: 22px 13px;
        align-items: flex-start;
      }

      .card {
        width: 100%;
        margin-top: 10px;
        padding: 48px 18px 29px;
        border-radius: 29px;
      }

      .title {
        font-size: clamp(48px, 17vw, 68px);
        letter-spacing: 0.05em;
      }

      .subtitle {
        margin-top: 15px;
        margin-bottom: 30px;
        font-size: 19px;
      }

      .divider {
        margin-bottom: 36px;
      }

      .note-label {
        top: -21px;
        min-width: 190px;
        padding: 10px 22px 11px;
        font-size: 20px;
      }

      .letter {
        padding: 43px 17px 23px;
      }

      .letter-content {
        font-size: 16px;
        line-height: 2.25;
      }

      .reveal-button {
        margin-top: 25px;
        padding: 12px 31px;
        font-size: 17px;
      }

      .hidden-note-box {
        padding: 21px 16px;
      }

      .hidden-note-box p {
        font-size: 15px;
        line-height: 1.9;
      }

      .footer-heart {
        margin-top: 26px;
      }

      .cloud-one {
        top: 4%;
        transform: scale(0.74);
      }

      .cloud-two {
        bottom: 4%;
        transform: scale(0.69);
      }

      .sparkle-one {
        top: 72px;
        right: 23px;
      }

      .sparkle-two {
        left: 21px;
        bottom: 87px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart,
      .cloud,
      .sparkle {
        animation: none;
      }

      .heart {
        display: none;
      }

      .hidden-note,
      .reveal-button {
        transition: none;
      }
    }
  </style>

</head>

<body>
  <main class="shuma-page">
    <div class="cloud cloud-one" aria-hidden="true"></div>
    <div class="cloud cloud-two" aria-hidden="true"></div>

  <span class="heart" style="left: 18%; --size: 11px; --heart-color: #a9dcf7; --duration: 12s; --delay: -5s;"></span>
  <span class="heart" style="left: 25%; --size: 17px; --heart-color: #ffffff; --duration: 18s; --delay: -11s;"></span>
  <span class="heart" style="left: 33%; --size: 12px; --heart-color: #ffc6df; --duration: 14s; --delay: -1s;"></span>
  <span class="heart" style="left: 40%; --size: 14px; --heart-color: #b6e2f8; --duration: 16s; --delay: -10s;"></span>
  <span class="heart" style="left: 49%; --size: 9px; --heart-color: #ffffff; --duration: 12s; --delay: -7s;"></span>
  <span class="heart" style="left: 57%; --size: 18px; --heart-color: #ffd9ea; --duration: 19s; --delay: -12s;"></span>
  <span class="heart" style="left: 64%; --size: 11px; --heart-color: #ffffff; --duration: 14s; --delay: -4s;"></span>
  <span class="heart" style="left: 71%; --size: 16px; --heart-color: #abdafa; --duration: 17s; --delay: -9s;"></span>
  <span class="heart" style="left: 78%; --size: 12px; --heart-color: #ffd1e4; --duration: 13s; --delay: -6s;"></span>
  <span class="heart" style="left: 86%; --size: 20px; --heart-color: #ffffff; --duration: 18s; --delay: -13s;"></span>
  <span class="heart" style="left: 92%; --size: 13px; --heart-color: #b1ddf6; --duration: 15s; --delay: -3s;"></span>
  <span class="heart" style="left: 97%; --size: 10px; --heart-color: #ffdaea; --duration: 12s; --delay: -9s;"></span>
</div>

<section class="card" aria-label="Shuma page">
  <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
  <span class="sparkle sparkle-two" aria-hidden="true">✦</span>

  <h1 class="title">{{ .Title }}</h1>

  {{ with .Params.subtitle }}
    <p class="subtitle">{{ . }}</p>
  {{ end }}

  <div class="divider" aria-hidden="true">
    <span>♡</span>
  </div>

  <div class="letter">
    {{ with .Params.note_label }}
      <div class="note-label">{{ . }}</div>
    {{ end }}

    <div class="letter-content">
      {{ .Content }}
    </div>
  </div>

  {{ with .Params.english_note }}
    <button
      class="reveal-button"
      id="revealButton"
      type="button"
      aria-expanded="false"
      aria-controls="englishNote"
      data-open-text="{{ with $.Params.open_text }}{{ . }}{{ else }}あけて{{ end }}"
      data-close-text="{{ with $.Params.close_text }}{{ . }}{{ else }}とじて{{ end }}"
    >
      <span class="button-heart">♡</span>
      <span id="buttonText">{{ with $.Params.open_text }}{{ . }}{{ else }}あけて{{ end }}</span>
      <span class="button-heart">♡</span>
    </button>

    <div class="hidden-note" id="englishNote">
      <div class="hidden-note-inner">
        <div class="hidden-note-box">
          <p>{{ . }}</p>
        </div>
      </div>
    </div>
  {{ end }}

  <p class="footer-heart" aria-hidden="true">♡</p>
</section>
```

  </main>

  <script>
    const revealButton = document.getElementById("revealButton");
    const englishNote = document.getElementById("englishNote");
    const buttonText = document.getElementById("buttonText");

    if (revealButton && englishNote && buttonText) {
      revealButton.addEventListener("click", function () {
        const isOpen = englishNote.classList.toggle("is-open");

        revealButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
        buttonText.textContent = isOpen
          ? revealButton.dataset.closeText
          : revealButton.dataset.openText;
      });
    }
  </script>

</body>
</html>
